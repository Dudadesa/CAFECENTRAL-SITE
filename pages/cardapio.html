<!DOCTYPE html>
<html>
    <head>
        <title>Cardápio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="widht=device-width, initial-scale=1.0">
        <meta name="description" content="Cardapio">
        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>
        <script>
            // Assim que a página carrega, pergunta ao servidor:
            //tem alguém logado?
            fetch("http://localhost:3000/me",{
                credentials: "include" 
                    // Envia o cookie de sessão junto com a requisição
            })
            .then(resposta => {
                if(!resposta.ok){
                    alert("Você precisa fazer o login para acessar o cardapio!");
                    window.location.href = "login.html";
                }
                // se resposta.ok = true, a página simplesmente continua carregando
            })
        </script>    

         <header class="topo">
            <div class="logo">
                <a href="../index.html">Cafe<span>Central</span></a>
            </div>
            <nav class="menu"> <!-- Menu de navegação-->
                    <a href="../index.html"class="ativo=">Inicio</a>
                    <a href="cardapio.html">Cardápio</a>
                    <a href="sobre.html">Sobre Nós</a>
                    <a href="contato.html">Contato</a>
            </nav>
        </header>
        <!-- Conteúdo da página -->

          <!-- Seção do cardapio -->
          <section class="cardapio">

            <h1>Nosso Cardapio</h1>

             <!-- CONTAINER PARA AGRUPAR OS CAR -->
            <div id="ListaCardapio" class="Cardapio-grid"> 
                <!-- O JS IRÁ MONTAR O CARDAPIO AQUI DENTRO -->
            </div>
        
        
        </section>

        

        <!-- Rodapé reutilizado -->
        <footer class="rodape">
            <p>® 2026 CafeCentral. Todos os Direitos Reservados</p>
            <p><a href="contato.html">Entre em Contato</a></p>
        </footer>

        <script src="../js/script.js"></script>

    </body>
</html>
